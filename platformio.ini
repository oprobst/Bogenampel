; Bogenampel V3 — Zentrales PlatformIO-Projekt
; Sender (ESP32-S3-WROOM-1U-N16R8) + Empfänger (Seeed XIAO ESP32C3)
;
; Repo-Root als Arbeitsverzeichnis öffnen (nicht SenderV3/ oder EmpfaengerV3/).
;
; USB-Flash:  pio run -t upload -e sender        / -e empfaenger
; OTA-Flash:  pio run -t upload -e sender-ota    / -e empfaenger-ota
; Monitor:    pio device monitor -e sender        / -e empfaenger
;
; OTA-Voraussetzung: wifi_credentials.h im Repo-Root anlegen (Vorlage:
; wifi_credentials.h.example). Ohne die Datei → SoftAP-Fallback.

[platformio]
src_dir = .
default_envs = sender, empfaenger

; =============================================================================
; Sender — ESP32-S3-WROOM-1U-N16R8 (16 MB Flash, 8 MB Octal-PSRAM)
; =============================================================================

[sender_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<SenderV3/> -<SenderV3/.pio/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/SenderV3
    -I${PROJECT_DIR}
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library

[env:sender]
extends = sender_base

[env:sender-ota]
extends = sender_base
upload_protocol = espota
upload_port = bogenampel-sender.local
upload_flags =
    --port=3232
    --auth=bogenampel

; =============================================================================
; Empfänger — Seeed XIAO ESP32C3 (4 MB Flash)
; =============================================================================

[empfaenger_base]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
build_src_filter = -<*> +<EmpfaengerV3/> -<EmpfaengerV3/.pio/>
build_flags =
    -I${PROJECT_DIR}/EmpfaengerV3
    -I${PROJECT_DIR}
monitor_speed = 115200
lib_deps =
    fastled/FastLED

[env:empfaenger]
extends = empfaenger_base

[env:empfaenger-ota]
; OTA nur im Wartungsmodus erreichbar: Empfänger mit gehaltenem Debug-Taster (D7)
; einschalten (Status-LED blinkt langsam = bereit), DANN flashen.
; upload_port = aktuelle/reservierte IP des Empfängers im Heimnetz (DHCP-Reservierung
; auf die XIAO-MAC empfohlen — mDNS .local quert die LAN/WLAN-Subnetzgrenze nicht).
; Windows: vor dem Upload  $env:PYTHONIOENCODING="utf-8"  setzen (esptool/espota-Unicode).
extends = empfaenger_base
upload_protocol = espota
upload_port = 192.168.3.76
upload_flags =
    --port=3232
