; Bogenampel V3 — Zentrales PlatformIO-Projekt
; Sender (ESP32-S3-WROOM-1U-N16R8) + Empfänger (Seeed XIAO ESP32C3)
;
; Repo-Root als Arbeitsverzeichnis öffnen (nicht Sender/ oder Empfaenger/).
;
; USB-Flash:  pio run -t upload -e sender        / -e empfaenger
; OTA-Flash:  pio run -t upload -e sender-ota    / -e empfaenger-ota
; Monitor:    pio device monitor -e sender        / -e empfaenger
;
; Testlauf mit verkürzten Zeiten (5 s Vorbereitung, 6 s statt 120 s, 12 s statt
; 240 s) — immer BEIDE Geräte umstellen:
;   pio run -t upload -e sender-debug-ota  / -e empfaenger-debug-ota
;
; Feld-Build (Sender, ohne Debug-Ausgaben und CDC):
;   pio run -e sender-release              nur bauen
;   pio run -t upload -e sender-release-ota   per OTA aufspielen
; Die beiden erzeugen dasselbe Image — verifiziert 2026-08-02: die Binaries
; unterscheiden sich nur im Compile-Zeitstempel und den beiden daraus
; abgeleiteten SHA256-Hashes.
;
; -----------------------------------------------------------------------------
; WINDOWS: vor JEDEM Upload (USB wie OTA)  $env:PYTHONIOENCODING="utf-8"  setzen.
; Ohne das bricht der Upload mit
;   UnicodeEncodeError: 'charmap' codec can't encode characters ...
;   *** [upload] Error 4294967295
; ab: esptool/espota schreiben Unicode-Fortschrittsbalken, die eine cp1252-
; Konsole nicht kodieren kann — PlatformIO stirbt dann im Ausgabe-Thread. Der
; Fehler sieht aus wie ein Verbindungs- oder Hardwareproblem, ist aber keins;
; auf den Chip wurde zu diesem Zeitpunkt noch nichts geschrieben.
; -----------------------------------------------------------------------------
;
; Sender-USB-Flash: BTN1 während des GESAMTEN Uploads gedrückt halten. Der Reset
; von esptool lässt sonst den Power-Latch fallen, das Gerät schaltet sich mitten
; im Flashen ab und der native USB-CDC-Port verschwindet.
;
; OTA-Voraussetzung: wifi_credentials.h im Repo-Root anlegen (Vorlage:
; wifi_credentials.h.example). Beide Geräte erreichen OTA ausschließlich im
; Wartungsmodus (siehe die -ota-Environments); einen SoftAP-Fallback gibt es
; bewusst nicht — ein zweites Netz auf fremdem Kanal legt ESP-NOW still.

[platformio]
src_dir = .
default_envs = sender, empfaenger

; =============================================================================
; Sender — ESP32-S3-WROOM-1U-N16R8 (16 MB Flash, 8 MB Octal-PSRAM)
; =============================================================================

[sender_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; Baudrate NICHT hochsetzen: der Sender flasht über die native USB-Serial/JTAG-
; Peripherie, wo die Baudrate bedeutungslos ist. esptool wechselt trotzdem
; (Board-Default 460800) und der Port re-enumeriert dabei — der Upload stirbt
; mit "PermissionError(13) ... Cannot configure port" mitten im Stub-Flasher.
; Sieht nach Kabel-/Latch-Problem aus, ist keins. 115200 = kein Wechsel.
upload_speed = 115200
build_src_filter = -<*> +<Sender/> -<Sender/.pio/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/Sender
    -I${PROJECT_DIR}
monitor_speed = 115200
; Versionen gepinnt (2026-10-01): unpinned zieht ein neu angelegtes Environment
; die jeweils aktuellste Version und baut dann anders als die bestehenden — beim
; Anlegen von env:empfaenger-debug kam so FastLED 3.10.5 herein und brach den
; Build (ambiguous memcpy), während env:empfaenger mit gecachtem 3.10.3 weiterlief.
; Das sind die Stände, mit denen die Firmware verifiziert ist.
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6

[env:sender]
extends = sender_base

[env:sender-debug]
; Testlauf mit verkürzten Zeiten: Vorbereitung 5 s (statt 10), Schießzeit 6 s
; (statt 120) bzw. 12 s (statt 240). Damit läuft eine komplette Passe inkl.
; Passenende in unter einer Minute durch.
;
; WICHTIG: Immer BEIDE Geräte als Paar umstellen (empfaenger-debug bzw.
; empfaenger-debug-ota). Der Empfänger zählt die Passe autonom und bekommt per
; Funk nur CMD_START_120/240 — ein Debug-Sender an einem normalen Empfänger
; zeigt zwei verschiedene Countdowns.
extends = sender_base
build_flags =
    ${sender_base.build_flags}
    -DDEBUG_SHORT_TIMES=1

[env:sender-debug-ota]
; env:sender-debug per OTA (Wartungsmodus: BTN1 + BTN2 beim Einschalten halten)
extends = env:sender-debug
upload_protocol = espota
upload_port = 192.168.3.77
upload_flags =
    --port=3232

[env:sender-release]
; Feld-/Auslieferungs-Build: keine Debug-Ausgaben, kein CDC-Task beim Boot.
; Spart Strom und Bootzeit; geflasht wird weiter über die USB-Serial/JTAG-
; Peripherie (ARDUINO_USB_MODE=1 bleibt), es meldet sich im Betrieb nur kein
; serieller Port mehr. Zum Debuggen env:sender nehmen.
extends = sender_base
build_flags =
    ${sender_base.build_flags}
    -DDEBUG_ENABLED=0
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:sender-ota]
; OTA nur im Wartungsmodus erreichbar: Sender mit BTN1 + BTN2 gleichzeitig
; einschalten. Das Display zeigt dann Verbindungsstatus und die eigene IP.
; upload_port = feste DHCP-Reservierung auf die Sender-MAC 14:c1:9f:36:bc:18
; (mDNS bogenampel-sender.local quert die LAN/WLAN-Subnetzgrenze nicht
; zuverlässig — deshalb die IP, wie beim Empfänger). Weicht die Anzeige auf dem
; Display davon ab, hat der Router etwas anderes vergeben: dann die angezeigte
; IP verwenden.
; Kein --auth: das ArduinoOTA-Passwort (PBKDF2) ist mit espota.py inkompatibel,
; der Zugang ist stattdessen durch das physische Taster-Gate geschützt.
extends = sender_base
upload_protocol = espota
upload_port = 192.168.3.77
upload_flags =
    --port=3232

[env:sender-release-ota]
; Feld-Build per OTA aufspielen: env:sender-release (ohne Debug-Ausgaben und
; ohne CDC) über denselben Wartungsmodus-Weg wie env:sender-ota. Das ist der
; Environment für die Auslieferung — env:sender-ota liefert den Debug-Build und
; ist zum Entwickeln gedacht.
;
; Achtung: Danach meldet sich kein serieller Port mehr. Ein Rückweg auf den
; Debug-Build geht weiterhin per OTA (env:sender-ota), solange der
; Wartungsmodus erreichbar bleibt — nur eben ohne Monitor zum Mitlesen.
extends = env:sender-release
upload_protocol = espota
upload_port = 192.168.3.77
upload_flags =
    --port=3232

; =============================================================================
; Empfänger — Seeed XIAO ESP32C3 (4 MB Flash)
; =============================================================================

[empfaenger_base]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
build_src_filter = -<*> +<Empfaenger/> -<Empfaenger/.pio/>
build_flags =
    -I${PROJECT_DIR}/Empfaenger
    -I${PROJECT_DIR}
monitor_speed = 115200
; Version gepinnt — siehe Begründung bei [sender_base].
; FastLED 3.10.5 baut NICHT (ambiguous memcpy in updatePotis(), FastLED zieht
; über fl/stl/bit_cast.h ein eigenes memcpy in den globalen Namensraum).
lib_deps =
    fastled/FastLED@3.10.3

[env:empfaenger]
extends = empfaenger_base

[env:empfaenger-debug]
; Gegenstück zu env:sender-debug — gleiche verkürzte Zeittabelle (5 s / 6 s / 12 s).
; Nur im Paar mit dem Sender flashen, siehe Hinweis bei env:sender-debug.
extends = empfaenger_base
build_flags =
    ${empfaenger_base.build_flags}
    -DDEBUG_SHORT_TIMES=1

[env:empfaenger-debug-ota]
; env:empfaenger-debug per OTA (Wartungsmodus: Debug-Taster D7 beim Einschalten halten)
extends = env:empfaenger-debug
upload_protocol = espota
upload_port = 192.168.3.76
upload_flags =
    --port=3232

[env:empfaenger-ota]
; OTA nur im Wartungsmodus erreichbar: Empfänger mit gehaltenem Debug-Taster (D7)
; einschalten (Status-LED blinkt langsam = bereit), DANN flashen.
; upload_port = aktuelle/reservierte IP des Empfängers im Heimnetz (DHCP-Reservierung
; auf die XIAO-MAC empfohlen — mDNS .local quert die LAN/WLAN-Subnetzgrenze nicht).
extends = empfaenger_base
upload_protocol = espota
upload_port = 192.168.3.76
upload_flags =
    --port=3232
