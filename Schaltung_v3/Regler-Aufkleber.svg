<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bogenampel Empfänger - Beschriftung der drei Drehregler (Potis)
  Maßstab 1:1  (viewBox-Einheit = 1 mm).  Knopf-Ø 15 mm, Raster 25 mm horizontal.
  Skala 270° (Anschlag links unten = 0 %, Anschlag rechts unten = 100 %),
  im Uhrzeigersinn steigend.  Texte als <text> (zum Umbenennen leicht editierbar).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="90mm" height="53mm" viewBox="0 0 90 53"
     font-family="Arial, Helvetica, sans-serif">

  <!-- Hintergrund / Aufkleber-Rand -->
  <rect x="0.5" y="0.5" width="89" height="52" rx="3" ry="3"
        fill="#ffffff" stroke="#000000" stroke-width="0.3"/>

  <!-- Überschrift -->
  <text x="45" y="13.5" text-anchor="middle" font-size="6" font-weight="bold"
        fill="#11225e">Bogenampel</text>
  <line x1="10" y1="17.5" x2="80" y2="17.5" stroke="#000000" stroke-width="0.25"/>

  <!-- Wiederverwendbare Skala (lokaler Mittelpunkt = 0,0 = Knopfachse) -->
  <defs>
    <g id="dial" fill="none" stroke="#000000">
      <!-- Montage-Hilfskreis (ca. 1 mm weiter als der 15-mm-Knopf) -->
      <circle r="8.5" stroke="#9aa0a6" stroke-width="0.3"/>
      <circle r="0.5" fill="#9aa0a6" stroke="none"/>
      <!-- dünner Skalenbogen 270° -->
      <path d="M -6.36 6.36 A 9 9 0 1 1 6.36 6.36" stroke="#666666" stroke-width="0.25"/>
      <!-- Hauptteilstriche 0 / 50 / 100 % -->
      <path d="M -6.57 6.57 L -7.92 7.92" stroke-width="0.45"/>
      <path d="M 0 -9.30 L 0 -11.20"      stroke-width="0.45"/>
      <path d="M 6.57 6.57 L 7.92 7.92"   stroke-width="0.45"/>
      <!-- Zwischenstriche 25 / 75 % -->
      <path d="M -8.59 -3.56 L -9.61 -3.98" stroke-width="0.3"/>
      <path d="M 8.59 -3.56 L 9.61 -3.98"   stroke-width="0.3"/>
      <!-- Prozent-Beschriftung (0/100 etwas tiefer) -->
      <text x="-9.33" y="10.3" text-anchor="middle" dominant-baseline="middle"
            font-size="2.3" fill="#000000" stroke="none">0%</text>
      <text x="0.5" y="-13.4" text-anchor="middle" dominant-baseline="middle"
            font-size="2.3" fill="#000000" stroke="none">50%</text>
      <text x="9.33" y="10.3" text-anchor="middle" dominant-baseline="middle"
            font-size="2.3" fill="#000000" stroke="none">100%</text>
    </g>
  </defs>

  <!-- Drei Regler: Mitten bei x = 20 / 45 / 70, y = 44 -->
  <use xlink:href="#dial" href="#dial" x="20" y="35"/>
  <use xlink:href="#dial" href="#dial" x="45" y="35"/>
  <use xlink:href="#dial" href="#dial" x="70" y="35"/>

  <!-- 5-mm-Kreis (Ø): vom linken Regler 25 mm nach oben, 15 mm nach links → (5, 10) -->
  <circle cx="5" cy="10" r="2.5" fill="none" stroke="#000000" stroke-width="0.3"/>

  <!-- Kleine Zielscheibe (Bogenschießen) rechts oben im Eck -->
  <g>
    <circle cx="81" cy="9.5" r="5.5" fill="#ffffff" stroke="#000000" stroke-width="0.3"/>
    <circle cx="81" cy="9.5" r="4.4" fill="#000000"/>
    <circle cx="81" cy="9.5" r="3.3" fill="#1f9fd6" stroke="#000000" stroke-width="0.12"/>
    <circle cx="81" cy="9.5" r="2.2" fill="#e2231a" stroke="#000000" stroke-width="0.12"/>
    <circle cx="81" cy="9.5" r="1.1" fill="#ffd400" stroke="#000000" stroke-width="0.12"/>
  </g>

  <!-- Reglernamen unter den Reglern -->
  <text x="20" y="50.5" text-anchor="middle" font-size="3.4" font-weight="bold"
        fill="#1565C0">Helligkeit</text>
  <text x="45" y="50.5" text-anchor="middle" font-size="3.4" font-weight="bold"
        fill="#D32F2F">Lautstärke</text>
  <text x="70" y="50.5" text-anchor="middle" font-size="3.4" font-weight="bold"
        fill="#2E7D32">Lüfter</text>
</svg>
